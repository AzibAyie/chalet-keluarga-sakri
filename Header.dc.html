<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":null,"default":""},"$preview":{"width":1280,"height":70}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false };
  }

  openMenu() {
    this.setState({ open: true });
    setTimeout(function () { const b = document.querySelector('.menu-close'); if (b) b.focus(); }, 60);
  }

  closeMenu() {
    if (!this.state.open) return;
    this.setState({ open: false });
    const m = document.querySelector('.menu-btn');
    if (m) m.focus();
  }

  renderVals() {
    const self = this;
    const current = this.props.current || '';
    const on = {};
    ['home', 'about', 'rooms', 'map', 'experience', 'gallery', 'reviews', 'location', 'booking'].forEach(function (k) { on[k] = k === current ? 'on' : ''; });
    return {
      on: on,
      sheetClass: this.state.open ? 'open' : '',
      menuOpen: String(this.state.open),
      openMenu: function () { self.openMenu(); },
      closeMenu: function () { self.closeMenu(); }
    };
  }

  // Site-wide touches live here because every page includes the header.
  componentDidMount() {
    const self = this;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // header shadow once the page scrolls
    const header = document.getElementById('site-header');
    this._onScroll = function () { if (header) header.classList.toggle('scrolled', window.scrollY > 10); };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();

    // gentle pop-in as things scroll into view (also for content rendered later)
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1 });
    let n = 0;
    const watch = function (root) {
      const els = [];
      if (root.classList && root.classList.contains('pop-in')) els.push(root);
      if (root.querySelectorAll) els.push.apply(els, root.querySelectorAll('.pop-in:not(.in)'));
      els.forEach(function (el) { if (!el.style.transitionDelay) el.style.transitionDelay = (n++ % 3) * 0.08 + 's'; io.observe(el); });
    };
    watch(document);
    this._mo = new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (node) { if (node.nodeType === 1) watch(node); }); }); });
    this._mo.observe(document.body, { childList: true, subtree: true });
    this._io = io;
    document.addEventListener('transitionend', function (e) {
      if (e.target.classList && e.target.classList.contains('in') && e.propertyName === 'opacity') e.target.style.transitionDelay = '';
    });

    // falling leaves
    const colors = ['#8DBF7F', '#5E9A5C', '#CBE3B5', '#F6C35B', '#F2B8A2'];
    window.sakriLeaves = function (x, y, count) {
      if (reduceMotion) return;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'leaf-fx';
        const c = colors[Math.floor(Math.random() * colors.length)];
        el.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15z" fill="' + c + '"/><path d="M5 19L14 10" stroke="rgba(47,74,51,.5)" stroke-width="1.4" stroke-linecap="round"/></svg>';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
        el.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        el.style.animationDelay = (i * 0.05) + 's';
        el.style.animationDuration = (1.4 + Math.random() * 0.8) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', function () { el.remove(); });
      }
    };

    this._onKey = function (e) { if (e.key === 'Escape') self.closeMenu(); };
    document.addEventListener('keydown', this._onKey);
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
    document.removeEventListener('keydown', this._onKey);
    if (this._mo) this._mo.disconnect();
    if (this._io) this._io.disconnect();
  }
}
</script>
</body>
